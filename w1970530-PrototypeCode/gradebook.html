<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradebook | VLE.TEACHER</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .vle-tabs { display: flex; gap: 30px; margin-bottom: 2.5rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; }
        .tab-item { color: #3b82f6; text-decoration: none; font-weight: 600; position: relative; cursor: pointer; font-size: 1.1rem; }
        .tab-item.active { color: #3b82f6; }
        .tab-item.active::after { content: ''; position: absolute; bottom: -11px; left: 0; width: 100%; height: 2px; background: #3b82f6; }
        .badge { background: #6366f1; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; margin-left: 6px; font-weight: 700; }
        
        .grade-table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: rgba(255,255,255,0.02); border-radius: 12px; overflow: hidden; }
        .grade-table th { text-align: left; padding: 15px; color: #94a3b8; font-size: 0.85rem; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .grade-table td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .module-selector { padding: 12px; background: #1e293b; border: 1px solid #3b82f6; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; appearance: none; min-width: 220px; }
        .module-selector option { background: #0f172a; color: white; }

        .grade-input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: white; padding: 8px; width: 70px; text-align: center; font-weight: bold; }
        .feedback-input { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); border-radius: 6px; color: #cbd5e1; padding: 8px; width: 100%; font-size: 0.85rem; }
        
        /* Highlighting Logic */
        .name-normal { color: #ffffff !important; font-weight: 600; }
        .name-highlight-fail { color: #ef4444 !important; font-weight: 800; }

        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .status-pass { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .status-fail { background: rgba(239, 68, 68, 0.1); color: #ef4444; }

        .switch { position: relative; display: inline-block; width: 40px; height: 20px; margin-right: 10px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #3b82f6; }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body>
    <div class="sidebar">
    <h2 style="color: #ffffff; margin-bottom: 2rem; letter-spacing: -1px; font-weight: 800; padding-left: 1.5rem;">VLE.ADMIN</h2>
    <nav style="display: flex; flex-direction: column; gap: 8px;">
        <a href="teacher.html" class="nav-link">📊 Command Center</a>
        <a href="module.html" class="nav-link">📚 My Modules</a>
        <a href="/" class="nav-link" style="margin-top: auto; color: #ef4444; padding-left: 1.5rem;">Logout</a>
    </nav>
</div>


    <div class="main-content">
        <div class="vle-tabs">
            <a href="module.html" class="tab-item">Content</a>
            <a href="calendar.html" class="tab-item">Calendar</a>
            <a href="announcements.html" class="tab-item">Announcements <span class="badge">24</span></a>
            <a href="gradebook.html" class="tab-item active">Gradebook</a>
            <a href="messages.html" class="tab-item">Messages <span class="badge">6</span></a>
        </div>

        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h1>Gradebook Management</h1>
                <div style="display: flex; align-items: center; margin-top: 10px;">
                    <label class="switch">
                        <input type="checkbox" id="emailNotify" checked>
                        <span class="slider"></span>
                    </label>
                    <span style="font-size: 0.85rem; color: #94a3b8;">Auto-email students on grade update</span>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-premium" onclick="messageFailures()" style="width: auto; background: #6366f1; border-radius: 8px;">✉ Bulk Message Failures</button>
                <button class="btn-premium" onclick="saveAllGrades()" style="width: auto; background: #3b82f6; border-radius: 8px;">💾 Save All Changes</button>
                <button class="btn-premium" onclick="exportGrades()" style="width: auto; background: #10b981; border-radius: 8px;">📊 Export CSV</button>
            </div>
        </header>

        <div class="card">
            <div style="display: flex; gap: 20px; margin-bottom: 25px; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 20px;">
                <div>
                    <label style="display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px;">Module</label>
                    <select id="modulePick" class="module-selector" onchange="loadFullRoster()">
                        <option value="0">6BUIS019W: Digital Strategy</option>
                        <option value="1">6COSC019W: Cyber Security</option>
                        <option value="2" selected>6COSC020W: Applied AI</option>
                    </select>
                </div>
                <div>
                    <label style="display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px;">Component</label>
                    <select class="module-selector" style="background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2);">
                        <option>Coursework 1 (40%)</option>
                        <option>Final Exam (60%)</option>
                    </select>
                </div>
            </div>

            <table class="grade-table">
                <thead>
                    <tr>
                        <th style="width: 180px;">Student Name</th>
                        <th style="width: 100px;">ID</th>
                        <th style="width: 100px;">Mark (%)</th>
                        <th style="width: 80px;">Grade</th>
                        <th style="width: 250px;">Feedback / Comments</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="gradeBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const classRoster = [
            { name: "Alice Thompson", id: "W1700000" },
            { name: "Ben Richards", id: "W1700001" },
            { name: "Chloe Evans", id: "W1700002" },
            { name: "Daniel Wu", id: "W1700003" },
            { name: "Elena Gomez", id: "W1700004" },
            { name: "Faisal Khan", id: "W1700005" }
        ];

        function loadFullRoster() {
            const body = document.getElementById('gradeBody');
            body.innerHTML = ""; 
            classRoster.forEach((s) => {
                const initialMark = 75; // All load in white initially
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong class="name-normal" id="name-${s.id}">${s.name}</strong></td>
                    <td style="color: #94a3b8;">${s.id}</td>
                    <td><input type="number" class="grade-input" value="${initialMark}" onchange="calculateGrade(this, '${s.id}', '${s.name}')"></td>
                    <td><strong class="grade-display">--</strong></td>
                    <td><input type="text" class="feedback-input" placeholder="Add feedback..." value="Well done."></td>
                    <td class="status-display">--</td>
                `;
                body.appendChild(row);
                calculateGrade(row.querySelector('.grade-input'), s.id, s.name, true);
            });
        }

        function calculateGrade(input, studentId, studentName, isInitialLoad = false) {
            const mark = parseInt(input.value);
            const row = input.closest('tr');
            const gradeDisplay = row.querySelector('.grade-display');
            const statusDisplay = row.querySelector('.status-display');
            const nameElement = document.getElementById(`name-${studentId}`);
            
            let grade = mark >= 70 ? 'A' : mark >= 60 ? 'B' : mark >= 50 ? 'C' : mark >= 40 ? 'D' : 'F';
            gradeDisplay.innerText = grade;

            if (mark < 40) {
                statusDisplay.innerHTML = '<span class="status-pill status-fail">Fail</span>';
                nameElement.className = 'name-highlight-fail'; // Highlight red
            } else {
                statusDisplay.innerHTML = '<span class="status-pill status-pass">Pass</span>';
                nameElement.className = 'name-normal'; // Default white
            }
        }

        function messageFailures() {
            let failingStudents = [];
            document.querySelectorAll('.grade-input').forEach(input => {
                if (parseInt(input.value) < 40) {
                    const name = input.closest('tr').querySelector('strong').innerText;
                    failingStudents.push(name);
                }
            });
            
            if (failingStudents.length === 0) {
                alert("No students currently meet the failure criteria.");
            } else {
                alert("Broadcast Window Opened for: " + failingStudents.join(", ") + "\n\nTemplate: 'Requesting resubmission workshop attendance.'");
            }
        }

        window.onload = loadFullRoster;
        function saveAllGrades() { alert("Grades saved."); }
        function exportGrades() { alert("Exporting CSV..."); }
    </script>
</body>
</html>
