<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Faculty Messages | VLE.ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1120;
            --side: #0f172a;
            --accent: #3b82f6;
            --text: #f8fafc;
            --card: rgba(30, 41, 59, 0.7);
            --danger: #ef4444;
            --success: #10b981;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
        }

        /* Sidebar Consistency */
        .sidebar { width: 260px; background: var(--side); height: 100vh; position: fixed; padding-top: 2rem; border-right: 1px solid rgba(255,255,255,0.05); }
        .sidebar h2 { color: var(--accent); padding-left: 1.5rem; margin-bottom: 2rem; font-weight: 800; letter-spacing: -1px; }
        .nav-link { color: #94a3b8; text-decoration: none; padding: 12px 1.5rem; display: block; border-radius: 8px; margin-right: 1.5rem; font-weight: 600; transition: 0.3s; }
        .nav-link:hover { color: white; }

        /* Top Navigation Tabs */
        .vle-tabs { display: flex; gap: 30px; margin-bottom: 2.5rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 10px; }
        .tab-item { color: #94a3b8; text-decoration: none; font-weight: 600; position: relative; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .tab-item.active { color: var(--accent); opacity: 1; }
        .tab-item.active::after { content: ''; position: absolute; bottom: -11px; left: 0; width: 100%; height: 2px; background: var(--accent); }
        .badge { background: #6366f1; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; margin-left: 6px; font-weight: 800; }

        /* Messenger Layout */
        .messenger-wrapper { 
            display: grid; 
            grid-template-columns: 320px 1fr; 
            background: rgba(30, 41, 59, 0.5); 
            border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 24px; 
            height: calc(100vh - 200px); 
            overflow: hidden; 
        }

        .chat-list { border-right: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.1); overflow-y: auto; }
        .chat-preview { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; transition: 0.2s; }
        .chat-preview.active { background: rgba(59, 130, 246, 0.1); border-left: 4px solid var(--accent); }
        
        .chat-window { display: flex; flex-direction: column; background: rgba(0,0,0,0.1); }
        .chat-header { padding: 20px 30px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
        .chat-body { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.02) 1px, transparent 0); background-size: 30px 30px; }
        
        /* Chat Bubbles */
        .bubble { 
            max-width: 65%; 
            padding: 14px 20px; 
            border-radius: 18px; 
            font-size: 0.9rem; 
            line-height: 1.5; 
            font-weight: 500;
        }
        .received { background: #1e293b; color: white; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
        .sent { background: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2); }
        
        /* Input Bar */
        .input-bar { padding: 25px; background: rgba(15, 23, 42, 0.8); border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 12px; }
        .msg-input { 
            flex: 1; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 14px; 
            color: white; 
            padding: 14px 20px; 
            outline: none; 
            font-family: inherit;
            transition: 0.3s;
        }
        .msg-input:focus { border-color: var(--accent); background: rgba(255,255,255,0.08); }

        .btn-premium {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-premium:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="padding-left: 1.5rem;">VLE.ADMIN</h2>
        <nav>
            <a href="teacher.html" class="nav-link">📊 Command Center</a>
            <a href="module.html" class="nav-link">📚 My Modules</a>
            <a href="/" class="nav-link" style="margin-top: 5rem; color: var(--danger);">🚪 Logout</a>
        </nav>
    </div>

    <div class="main-content" style="margin-left: 260px; padding: 40px; width: 100%;">
        <div class="vle-tabs">
            <a href="module.html" class="tab-item">Content</a>
            <a href="calendar.html" class="tab-item">Calendar</a>
            <a href="announcements.html" class="tab-item">Announcements <span class="badge">24</span></a>
            <a href="gradebook.html" class="tab-item">Gradebook</a>
            <a href="messages.html" class="tab-item active">Messages <span class="badge" id="msgBadge">0</span></a>
        </div>

        <div class="messenger-wrapper">
            <div class="chat-list">
                <div class="chat-preview active">
                    <strong style="color: white; display: block; font-size: 1rem;">Alice Thompson</strong>
                    <small style="color: #94a3b8; font-weight: 600;">ID: W1700000</small>
                </div>
            </div>

            <div class="chat-window">
                <div class="chat-header">
                    <div>
                        <h3 style="margin: 0; color: white; font-weight: 800;">Alice Thompson</h3>
                        <small style="color: var(--success); font-weight: 700;">● Online</small>
                    </div>
                    <button class="btn-premium" onclick="location.href='gradebook.html'">View Student Analytics</button>
                </div>
                
                <div class="chat-body" id="chatBody"></div>
                
                <div class="input-bar">
                    <input type="text" id="msgInput" class="msg-input" placeholder="Write a message to Alice..." onkeypress="if(event.key==='Enter') send()">
                    <button class="btn-premium" onclick="send()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatKey = 'chat_AliceThompson';

        function send() {
            const input = document.getElementById('msgInput');
            if(!input.value.trim()) return;
            let history = JSON.parse(localStorage.getItem(chatKey)) || [];
            history.push({ sender: 'Teacher', text: input.value });
            localStorage.setItem(chatKey, JSON.stringify(history));
            input.value = '';
            render();
        }

        function render() {
            const body = document.getElementById('chatBody');
            const history = JSON.parse(localStorage.getItem(chatKey)) || [];
            body.innerHTML = '';
            history.forEach(m => {
                const div = document.createElement('div');
                div.className = m.sender === 'Teacher' ? 'bubble sent' : 'bubble received';
                div.innerText = m.text;
                body.appendChild(div);
            });
            body.scrollTop = body.scrollHeight;
        }

        // Real-time updates
        setInterval(render, 1000);
        window.onload = render;
    </script>
</body>
</html>
