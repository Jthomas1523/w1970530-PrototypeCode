<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Calendar | VLE.ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --side: #1e293b;
            --accent: #3b82f6;
            --card: #1e293b;
            --text: #f8fafc;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            overflow-x: hidden;
        }

        /* Sidebar Consistency */
        .sidebar {
            width: 260px;
            height: 100vh;
            background: var(--side);
            padding: 2rem 1rem;
            position: fixed;
            left: 0; top: 0;
            box-sizing: border-box;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar h2 { color: var(--accent); padding-left: 1.5rem; margin-bottom: 2rem; font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; }
        
        .nav-link {
            color: #94a3b8;
            text-decoration: none;
            padding: 12px 1.5rem;
            display: block;
            border-radius: 8px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .nav-link.active { background: rgba(59, 130, 246, 0.1); color: var(--accent); }

        /* Main Content & Top Nav */
        .main-content {
            margin-left: 260px;
            padding: 3rem;
            width: calc(100% - 260px);
            box-sizing: border-box;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .nav-tabs { display: flex; gap: 2rem; align-items: center; }
        .tab-link {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 600;
            padding-bottom: 1.5rem;
            position: relative;
        }

        .tab-link.active-tab { color: var(--accent); }
        .tab-link.active-tab::after {
            content: '';
            position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: var(--accent);
        }

        .badge {
            background: #6366f1;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            margin-left: 6px;
            font-weight: 800;
        }

        /* Calendar Card */
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 1rem; }
        
        .day-cell {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            min-height: 110px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.02);
            transition: 0.2s;
            cursor: pointer;
        }
        .day-cell:hover:not(.empty) { border-color: var(--accent); background: rgba(59, 130, 246, 0.05); }
        .day-cell.today { border: 2px solid var(--accent); background: rgba(59, 130, 246, 0.05); }
        .day-cell.empty { background: transparent; border: none; cursor: default; }

        .event-tag {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 700;
            margin-top: 6px;
            display: block;
            color: white;
        }
        .tag-blue { background: var(--accent); }
        .tag-pink { background: #f472b6; }
        .tag-yellow { background: #facc15; color: #000; }

        .btn-premium {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Year View Grid */
        .year-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; display: none; }
        .mini-month { 
            background: rgba(255, 255, 255, 0.02); 
            padding: 15px; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }
        .mini-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; font-size: 0.6rem; text-align: center; }
        .mini-day.has-event { color: var(--accent); font-weight: bold; }

        /* Modal */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); display: none; 
            justify-content: center; align-items: center; z-index: 2000; 
        }
        .modal-card { background: var(--side); padding: 30px; border-radius: 20px; border: 1px solid var(--accent); width: 380px; }
        .modal-input { 
            width: 100%; padding: 12px; margin: 15px 0; 
            background: var(--bg); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 10px; color: white; outline: none; font-family: inherit;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>VLE.ADMIN</h2>
        <nav>
            <a href="teacher.html" class="nav-link">📊 Command Center</a>
            <a href="module.html" class="nav-link">📚 My Modules</a>
            <div style="margin-top: auto; padding-top: 5rem;">
                <a href="/" class="nav-link" style="color: var(--danger);">🚪 Logout</a>
            </div>
        </nav>
    </div>

    <div class="main-content">
        <div class="top-nav">
            <div class="nav-tabs">
                <a href="module.html" class="tab-link">Content</a>
                <a href="calendar.html" class="tab-link active-tab">Calendar</a>
                <a href="announcements.html" class="tab-link">Announcements <span class="badge">24</span></a>
                <a href="gradebook.html" class="tab-link">Gradebook</a>
                <a href="messages.html" class="tab-link">Messages</a>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-premium" style="background: var(--success);" onclick="window.print()">🖨 Print</button>
                <button class="btn-premium" onclick="toggleYearView()" id="viewToggle">📅 Year View</button>
            </div>
        </div>

        <div class="card">
            <div id="monthNav" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <button class="btn-premium" style="background: rgba(255,255,255,0.05);" onclick="changeMonth(-1)">❮ Prev</button>
                <h2 id="monthDisplay" style="margin:0; color: var(--accent); font-weight: 800;">February 2026</h2>
                <button class="btn-premium" style="background: rgba(255,255,255,0.05);" onclick="changeMonth(1)">Next ❯</button>
            </div>

            <div id="monthView">
                <div class="calendar-grid-header" style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; color: #94a3b8; font-size: 0.7rem; font-weight: 800; text-transform: uppercase;">
                    <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>

            <div class="year-grid" id="yearGrid"></div>
        </div>
    </div>

    <div class="modal-overlay" id="eventModal">
        <div class="modal-card">
            <h3 style="margin-top:0; font-weight: 800;">Manage Schedule</h3>
            <input type="text" id="eventTitleInput" class="modal-input" placeholder="Event Name (e.g., Seminar A)">
            <select id="eventTypeInput" class="modal-input">
                <option value="tag-blue">Lecture (Blue)</option>
                <option value="tag-pink">Seminar (Pink)</option>
                <option value="tag-yellow">Faculty Meeting (Yellow)</option>
            </select>
            <div style="display: flex; gap: 10px;">
                <button class="btn-premium" style="flex:1;" onclick="saveEvent()">Save</button>
                <button id="delBtn" class="btn-premium" style="flex:1; background: var(--danger); display:none;" onclick="deleteEvent()">Delete</button>
                <button class="btn-premium" style="flex:1; background: #334155;" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let currentViewDate = new Date(2026, 1, 1);
        let isYearView = false;
        let selectedDay = null;
        let globalEvents = JSON.parse(localStorage.getItem('teacher_calendar')) || {
            "2026-1": [
                { day: 1, title: '6BUIS019W: Lec', class: 'tag-blue' },
                { day: 3, title: '6COSC019W: Sem', class: 'tag-pink' },
                { day: 10, title: 'Faculty Meeting', class: 'tag-yellow' }
            ]
        };

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const display = document.getElementById('monthDisplay');
            grid.innerHTML = '';
            const year = currentViewDate.getFullYear();
            const month = currentViewDate.getMonth();
            display.innerText = currentViewDate.toLocaleString('default', { month: 'long', year: 'numeric' });
            
            let firstDay = new Date(year, month, 1).getDay();
            firstDay = (firstDay === 0) ? 6 : firstDay - 1; 

            for(let x=0; x<firstDay; x++) grid.innerHTML += `<div class="day-cell empty"></div>`;

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const monthKey = `${year}-${month}`;
            const monthEvents = globalEvents[monthKey] || [];

            for(let i=1; i<=daysInMonth; i++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                const today = new Date();
                if(i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) cell.classList.add('today');
                
                cell.onclick = () => openModal(i);
                const dayEvent = monthEvents.find(e => e.day === i);
                cell.innerHTML = `<span style="font-weight:700;">${i}</span>${dayEvent ? `<span class="event-tag ${dayEvent.class}">${dayEvent.title}</span>` : ''}`;
                grid.appendChild(cell);
            }
        }

        function toggleYearView() {
            isYearView = !isYearView;
            document.getElementById('monthView').style.display = isYearView ? 'none' : 'block';
            document.getElementById('yearGrid').style.display = isYearView ? 'grid' : 'none';
            document.getElementById('monthNav').style.display = isYearView ? 'none' : 'flex';
            document.getElementById('viewToggle').innerText = isYearView ? '📅 Month View' : '📅 Year View';
            if(isYearView) renderYear(); else renderCalendar();
        }

        function renderYear() {
            const yGrid = document.getElementById('yearGrid');
            yGrid.innerHTML = '';
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            months.forEach((m, idx) => {
                const monthEvents = globalEvents[`2026-${idx}`] || [];
                let days = '';
                for(let d=1; d<=28; d++) days += `<div class="mini-day ${monthEvents.some(e => e.day === d) ? 'has-event' : ''}">${d}</div>`;
                yGrid.innerHTML += `<div class="mini-month" onclick="jumpToMonth(${idx})"><h4 style="margin:0 0 10px 0; color:var(--accent); font-weight: 800;">${m}</h4><div class="mini-days">${days}</div></div>`;
            });
        }

        function jumpToMonth(m) { currentViewDate = new Date(2026, m, 1); toggleYearView(); }
        function changeMonth(s) { currentViewDate.setMonth(currentViewDate.getMonth() + s); renderCalendar(); }
        
        function openModal(day) {
            selectedDay = day;
            const monthKey = `${currentViewDate.getFullYear()}-${currentViewDate.getMonth()}`;
            const existing = (globalEvents[monthKey] || []).find(e => e.day === day);
            if(existing) {
                document.getElementById('eventTitleInput').value = existing.title;
                document.getElementById('eventTypeInput').value = existing.class;
                document.getElementById('delBtn').style.display = 'block';
            } else {
                document.getElementById('delBtn').style.display = 'none';
            }
            document.getElementById('eventModal').style.display = 'flex';
        }

        function saveEvent() {
            const title = document.getElementById('eventTitleInput').value;
            if(!title) return;
            const monthKey = `${currentViewDate.getFullYear()}-${currentViewDate.getMonth()}`;
            if(!globalEvents[monthKey]) globalEvents[monthKey] = [];
            const index = globalEvents[monthKey].findIndex(e => e.day === selectedDay);
            const data = { day: selectedDay, title, class: document.getElementById('eventTypeInput').value };
            if(index > -1) globalEvents[monthKey][index] = data;
            else globalEvents[monthKey].push(data);
            localStorage.setItem('teacher_calendar', JSON.stringify(globalEvents));
            closeModal(); renderCalendar();
        }

        function deleteEvent() {
            const monthKey = `${currentViewDate.getFullYear()}-${currentViewDate.getMonth()}`;
            globalEvents[monthKey] = globalEvents[monthKey].filter(e => e.day !== selectedDay);
            localStorage.setItem('teacher_calendar', JSON.stringify(globalEvents));
            closeModal(); renderCalendar();
        }

        function closeModal() { document.getElementById('eventModal').style.display = 'none'; document.getElementById('eventTitleInput').value = ''; }
        window.onload = renderCalendar;
    </script>
</body>
</html>
